name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-flavors:
    name: Android flavor compile
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pub get
        run: flutter pub get

      # TV-002: client × env flavors; CI compiles the local/dev graph.
      - name: Build TV dev debug APK
        run: flutter build apk --debug --flavor tvDev -t lib/main_tv.dart --dart-define=APP_ENV=dev

      - name: Build Companion dev debug APK
        run: flutter build apk --debug --flavor companionDev -t lib/main_companion.dart --dart-define=APP_ENV=dev
